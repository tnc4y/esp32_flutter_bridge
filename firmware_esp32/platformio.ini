; PlatformIO Project Configuration File for EspFlutterBridge
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0

build_unflags =
    -std=gnu++11

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
